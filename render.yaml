services:
  - type: web
    name: linkbypass
    runtime: python
    plan: free
    buildCommand: "pip install -r requirements.txt && python -m playwright install --with-deps chromium"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 600"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
      - key: PLAYWRIGHT_CHROMIUM_USE_HEADLESS_NEW
        value: 1
      - key: MAX_WORKERS
        value: 2
      - key: DB_PATH
        value: /opt/render/project/src/data/jobs.db
