services:
  - type: web
    name: linkbypass
    runtime: python
    plan: free
    buildCommand: "PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright-browsers pip install -r requirements.txt && PLAYWRIGHT_BROWSERS_PATH=/opt/render/project/src/.playwright-browsers python -m playwright install --with-deps chromium && echo BUILD_BROWSERS && ls /opt/render/project/src/.playwright-browsers/ && ls /opt/render/project/src/.playwright-browsers/chromium-*/ 2>/dev/null | head -n 5"
    startCommand: "gunicorn app:app --bind 0.0.0.0:$PORT --workers 1 --threads 8 --timeout 600"
    envVars:
      - key: PYTHON_VERSION
        value: 3.12.7
      - key: PLAYWRIGHT_BROWSERS_PATH
        value: /opt/render/project/src/.playwright-browsers
      - key: PLAYWRIGHT_CHROMIUM_USE_HEADLESS_NEW
        value: 1
      - key: MAX_WORKERS
        value: 2
      - key: DB_PATH
        value: /opt/render/project/src/data/jobs.db
      # --- Worker Bridge (GitHub Actions, free Azure runners) ---
      # Set these in the Render dashboard (NOT in git). Until set, the app
      # falls back to local Playwright.
      - key: GH_REPO
        sync: false
      - key: GH_TOKEN
        sync: false
      - key: BRIDGE_SECRET
        generateValue: true
      - key: RENDER_URL
        value: https://linkbypassor.onrender.com
